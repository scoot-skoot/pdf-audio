services:
  # Original one-shot CLI (unchanged usage): docker compose run --rm converter file.pdf
  converter:
    build: .
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    env_file:
      - .env

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pdfaudio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pdfaudio?sslmode=disable
      UPLOADS_DIR: /app/output/_uploads
      # Browser may hit the API directly on :8080; web UI usually uses the nginx proxy.
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080"
    ports:
      - "8080:8080"
    volumes:
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    working_dir: /app
    entrypoint: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pdfaudio
    env_file:
      - .env
    volumes:
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy

  # Audio Book Generator web UI — open http://localhost:5173
  web:
    build:
      context: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
